<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Mustafa Çor — workstation console</title>
  <desc id="desc">A late-1990s UNIX workstation service console showing Mustafa Çor's engineering identity and systems topology.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#737A70" stroke-width="1" opacity=".08"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#E7E1CF" stroke-width=".5" opacity=".035"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#A9B86E"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="2" fill="#151713" stroke="#737A70" stroke-width="2"/>
  <rect x="12" y="12" width="1176" height="376" fill="url(#grid)"/>
  <rect x="12" y="12" width="1176" height="376" fill="url(#scan)"/>

  <path d="M1 43H1199" stroke="#737A70" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="40" fill="#20231F"/>
  <rect x="18" y="16" width="11" height="11" fill="#8E4B3F"/>
  <rect x="36" y="16" width="11" height="11" fill="#D19A4A"/>
  <rect x="54" y="16" width="11" height="11" fill="#A9B86E"/>
  <text x="83" y="28" fill="#E7E1CF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing=".8">codercor@workstation:/srv — tty0</text>
  <text x="1175" y="28" fill="#737A70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="end">SUN-OPS // SESSION 0</text>

  <path d="M612 64V330" stroke="#737A70" stroke-width="1" stroke-dasharray="4 6" opacity=".8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="42" y="84" fill="#A9B86E" font-size="16">$ whoami</text>
    <text x="42" y="137" fill="#E7E1CF" font-size="46" font-weight="700" letter-spacing="-1">MUSTAFA ÇOR</text>
    <text x="44" y="174" fill="#D19A4A" font-size="19" font-weight="700" letter-spacing="1.2">SOFTWARE ENGINEER // DATA ENGINEER</text>

    <text x="43" y="221" fill="#737A70" font-size="14">UID</text>
    <text x="150" y="221" fill="#E7E1CF" font-size="14">codercor</text>
    <text x="43" y="248" fill="#737A70" font-size="14">UPTIME</text>
    <text x="150" y="248" fill="#A9B86E" font-size="14">11Y+ / PRODUCTION FIELD TIME</text>
    <text x="43" y="275" fill="#737A70" font-size="14">FOCUS</text>
    <text x="150" y="275" fill="#E7E1CF" font-size="14">BACKEND · DATA · PRODUCT SYSTEMS</text>
    <text x="43" y="302" fill="#737A70" font-size="14">POLICY</text>
    <text x="150" y="302" fill="#E7E1CF" font-size="14">ARCHITECTURE BEFORE MAGIC</text>

    <text x="650" y="84" fill="#A9B86E" font-size="16">$ systemctl status engineering.target</text>
    <text x="650" y="110" fill="#737A70" font-size="12" letter-spacing="1.4">LIVE SYSTEM TOPOLOGY</text>

    <g>
      <rect x="650" y="137" width="132" height="61" rx="1" fill="#20231F" stroke="#737A70"/>
      <rect x="660" y="148" width="8" height="8" fill="#A9B86E"/>
      <text x="676" y="157" fill="#737A70" font-size="11">PORT 10</text>
      <text x="716" y="181" fill="#E7E1CF" font-size="15" text-anchor="middle">INGEST</text>
    </g>
    <path d="M787 168H828" stroke="#A9B86E" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="836" y="137" width="132" height="61" rx="1" fill="#20231F" stroke="#737A70"/>
      <rect x="846" y="148" width="8" height="8" fill="#A9B86E"/>
      <text x="862" y="157" fill="#737A70" font-size="11">PORT 20</text>
      <text x="902" y="181" fill="#E7E1CF" font-size="15" text-anchor="middle">TRANSFORM</text>
    </g>
    <path d="M973 168H1014" stroke="#A9B86E" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="1022" y="137" width="132" height="61" rx="1" fill="#20231F" stroke="#737A70"/>
      <rect x="1032" y="148" width="8" height="8" fill="#D19A4A"/>
      <text x="1048" y="157" fill="#737A70" font-size="11">PORT 30</text>
      <text x="1088" y="181" fill="#E7E1CF" font-size="15" text-anchor="middle">STORE</text>
    </g>

    <path d="M1088 204V229H902V245" fill="none" stroke="#A9B86E" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="836" y="253" width="132" height="61" rx="1" fill="#20231F" stroke="#737A70"/>
      <rect x="846" y="264" width="8" height="8" fill="#A9B86E"/>
      <text x="862" y="273" fill="#737A70" font-size="11">PORT 40</text>
      <text x="902" y="297" fill="#E7E1CF" font-size="15" text-anchor="middle">SERVE</text>
    </g>
    <path d="M830 284H747" stroke="#A9B86E" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="650" y="253" width="90" height="61" rx="1" fill="#20231F" stroke="#737A70"/>
      <text x="695" y="275" fill="#737A70" font-size="11" text-anchor="middle">OUTPUT</text>
      <text x="695" y="297" fill="#D19A4A" font-size="15" text-anchor="middle">SHIP</text>
    </g>

    <rect x="1" y="344" width="1198" height="55" fill="#20231F"/>
    <path d="M1 344H1199" stroke="#737A70" stroke-width="2"/>
    <rect x="22" y="365" width="9" height="9" fill="#A9B86E"/>
    <text x="42" y="375" fill="#E7E1CF" font-size="13">BUILD: STABLE</text>
    <text x="256" y="375" fill="#737A70" font-size="13">GITHUB SINCE 2015</text>
    <text x="480" y="375" fill="#737A70" font-size="13">TZ: EUROPE/ISTANBUL</text>
    <text x="758" y="375" fill="#737A70" font-size="13">MODE: SHIPPING</text>
    <text x="1170" y="375" fill="#A9B86E" font-size="13" text-anchor="end">READY_</text>
    <rect x="1174" y="363" width="8" height="14" fill="#A9B86E">
      <animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
