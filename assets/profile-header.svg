<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mustafa Çor — Software Engineer and Data Engineer</title>
  <desc id="desc">Dark technical profile banner with blue and cyan accents.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10192B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="70%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <circle cx="1050" cy="48" r="120" fill="#2563EB" opacity="0.14" filter="url(#softGlow)"/>
  <circle cx="1125" cy="265" r="145" fill="#7C3AED" opacity="0.12" filter="url(#softGlow)"/>

  <g opacity="0.34" fill="none" stroke="url(#accent)">
    <path d="M845 76h205l72 72-72 72H845l-72-72z"/>
    <path d="M905 108h116l40 40-40 40H905l-40-40z"/>
    <path d="M965 136h35l13 12-13 12h-35l-12-12z"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif">
    <text x="72" y="72" fill="#7DD3FC" font-size="17" font-weight="650" letter-spacing="2.6">~/CODERCOR</text>
    <text x="70" y="154" fill="#F8FAFC" font-size="62" font-weight="760" letter-spacing="-1.8">Mustafa Çor</text>
    <rect x="72" y="178" width="590" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="222" fill="#CBD5E1" font-size="24" font-weight="560" letter-spacing="2.1">SOFTWARE ENGINEER  /  DATA ENGINEER</text>
    <text x="72" y="266" fill="#94A3B8" font-size="18" font-weight="430">Production software · data systems · developer tooling</text>
    <text x="1060" y="286" fill="#64748B" font-size="14" font-weight="600" text-anchor="end" letter-spacing="1.4">GITHUB SINCE 2015</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#334155" stroke-opacity="0.65" stroke-width="1.5"/>
</svg>
