    <g transform="translate(891 68)">
      <rect width="250" height="116" rx="1" fill="#20231F" stroke="#737A70"/>
      <rect x="12" y="12" width="8" height="8" fill="#A9B86E"/>
      <text x="29" y="21" fill="#D19A4A" font-size="11">SLOT D0 / DELIVERY</text>
      <text x="18" y="55" fill="#E7E1CF" font-size="15" font-weight="700">DOCKER  AWS  NGINX</text>
