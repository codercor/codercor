      <rect x="12" y="12" width="8" height="8" fill="#A9B86E"/>
      <text x="29" y="21" fill="#D19A4A" font-size="11">SLOT A0 / LANG</text>
      <text x="18" y="55" fill="#E7E1CF" font-size="17" font-weight="700">TS  JS  PY  SQL</text>
      <text x="18" y="84" fill="#737A70" font-size="11">TYPED APPLICATIONS</text>
      <text x="18" y="102" fill="#737A70" font-size="11">DATA + AUTOMATION</text>
      <path d="M125 116V137" stroke="#D19A4A" stroke-width="4"/>
