<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Engineering toolchain backplane</title>
  <desc id="desc">A workstation backplane connecting language, runtime, data, and delivery modules.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#737A70" stroke-width="1" opacity=".075"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="318" rx="2" fill="#151713" stroke="#737A70" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="38" fill="#20231F"/>
  <rect x="18" y="14" width="10" height="10" fill="#A9B86E"/>
  <text x="39" y="25" fill="#E7E1CF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">/dev/backplane0 — 16 modules detected</text>
  <text x="1178" y="25" fill="#737A70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">BUS 64-BIT // HEALTHY</text>
  <rect x="12" y="50" width="1176" height="218" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
