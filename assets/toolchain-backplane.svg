    <g transform="translate(614 68)">
      <rect width="250" height="116" rx="1" fill="#20231F" stroke="#737A70"/>
      <rect x="12" y="12" width="8" height="8" fill="#A9B86E"/>
      <text x="29" y="21" fill="#D19A4A" font-size="11">SLOT C0 / DATA</text>
      <text x="18" y="55" fill="#E7E1CF" font-size="15" font-weight="700">POSTGRES  SNOWFLAKE</text>
      <text x="18" y="80" fill="#E7E1CF" font-size="15" font-weight="700">DBT  REDIS</text>
      <text x="18" y="102" fill="#737A70" font-size="11">MODEL · QUERY · CACHE</text>
      <path d="M125 116V137" stroke="#D19A4A" stroke-width="4"/>
