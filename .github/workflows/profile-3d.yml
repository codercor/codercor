name: profile / dynamic components

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-dynamic-components
  cancel-in-progress: true

jobs:
  render-status:
    if: github.repository == 'codercor/codercor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Render public profile status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-profile-status.mjs

      - name: Upload profile status
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: profile-status
          path: profile-status/*.svg
          if-no-files-found: error
          retention-days: 1

  render-snake:
    if: github.repository == 'codercor/codercor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Render animated contribution history
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-snake/contribution-snake-light.svg?palette=github-light&color_snake=#1f6feb
            profile-snake/contribution-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Upload contribution history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: profile-snake
          path: profile-snake/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.repository == 'codercor/codercor'
    needs:
      - render-status
      - render-snake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}

      - name: Download profile status
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: profile-status
          path: .generated/status

      - name: Download contribution history
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: profile-snake
          path: .generated/snake

      - name: Install generated components
        run: |
          install -d assets/generated
          install -m 0644 .generated/status/profile-status-light.svg assets/generated/profile-status-light.svg
          install -m 0644 .generated/status/profile-status-dark.svg assets/generated/profile-status-dark.svg
          install -m 0644 .generated/snake/contribution-snake-light.svg assets/generated/contribution-snake-light.svg
          install -m 0644 .generated/snake/contribution-snake-dark.svg assets/generated/contribution-snake-dark.svg

      - name: Validate generated components
        run: |
          for file in \
            assets/generated/profile-status-light.svg \
            assets/generated/profile-status-dark.svg \
            assets/generated/contribution-snake-light.svg \
            assets/generated/contribution-snake-dark.svg
          do
            test -s "$file"
            test "$(wc -c < "$file")" -lt 2000000
            head -c 512 "$file" | grep -q '<svg'
            if grep -Eiq '<script|<foreignObject|on[a-z]+=' "$file"; then
              exit 1
            fi
          done

      - name: Publish refreshed components
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/generated/profile-status-light.svg \
            assets/generated/profile-status-dark.svg \
            assets/generated/contribution-snake-light.svg \
            assets/generated/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile components"
          git push origin "HEAD:${GITHUB_REF_NAME}"
